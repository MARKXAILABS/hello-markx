name: Bug report
description: Something isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug! Please fill out the sections below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, plus what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `npm run dev`
        2. Add an agent with command `...`
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      # This ask used to say "there is no log file yet", which was true when it
      # was written and is not any more: #13 landed a file sink that tees every
      # console.* in the main process into main.log. It then spelled the folder
      # out per platform, because the Settings shortcut that makes those paths
      # unnecessary was FLOOR-05 and had not shipped. It has now — plan 01-10
      # wired the button — so the paths are gone and the route is the plain one.
      label: Logs, console output, screenshots
      description: >-
        **From an installed build:** attach `main.log` (and `main.log.1` if it is
        there — the log rotates once at 5 MB). Open the folder from the app:
        **Settings → General → Log folder → `open logs`**.
        **From a dev build:** the terminal output of `npm run dev` is the same
        content and is easier to copy.
        Either way, the DevTools console (View → Toggle Developer Tools) carries
        renderer errors that never reach the file, so paste anything red there
        too. A screenshot or short clip is just as good for anything visual.
      render: shell
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. macOS 15.0, Windows 11 23H2, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      # Answerable on both install routes: a release build bundles its own
      # runtime, so someone who never built from source has no `node` to run and
      # would otherwise be stuck on a required field.
      placeholder: node -v — or "none" if you installed a release build
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version (if relevant)
      placeholder: claude --version
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight
      options:
        # Was an unconditional "I re-ran npm install", which nobody on a
        # downloaded release build can honestly tick — they never run npm at
        # all — so a required field forced them to lie or give up. Scoped to the
        # route it actually applies to.
        - label: If I built from source, I re-ran `npm install` so `node-pty` is rebuilt for the current Electron ABI (n/a for a downloaded release build).
          required: true
        - label: I searched existing issues and this isn't a duplicate.
          required: true
