name: Bug report
description: Something isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug! Please fill out the sections below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, plus what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `npm run dev`
        2. Add an agent with command `...`
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      # The app writes no log file (#13), so asking for "the logs" just sends
      # people hunting for a file that does not exist. Say where the output
      # actually is instead.
      label: Console output / screenshots
      description: >-
        There is no log file yet. From a dev build, paste the terminal output of
        `npm run dev`. From an installed build, open the DevTools console
        (View → Toggle Developer Tools) and paste anything red. A screenshot or
        short clip is just as good for anything visual.
      render: shell
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. macOS 15.0, Windows 11 23H2, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: node -v
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version (if relevant)
      placeholder: claude --version
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight
      options:
        - label: I re-ran `npm install` so `node-pty` is rebuilt for the current Electron ABI.
          required: true
        - label: I searched existing issues and this isn't a duplicate.
          required: true
