name: Release

# Build installers for every platform and publish them to a GitHub Release
# whenever a v* tag is pushed. Run manually (workflow_dispatch) to dry-build
# without publishing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Cheapest possible pre-flight, ahead of three platform builds. RELEASE.md is
  # published verbatim as the release body and its download table pins EXACT
  # artifact filenames, so one stale version string 404s every download link the
  # moment the release goes out. That is not hypothetical: the table sat at 0.3.2
  # from v0.3.4 through v0.3.7 and mac DMG downloads collapsed to single digits
  # while everything stayed green. Twenty seconds here, or a dead release page.
  # (Full story in the header of tools/check-release-links.cjs.)
  links:
    name: Verify advertised download links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Offline mode — no node_modules needed, the checker is fs + fetch only.
      - name: RELEASE.md / docs versions match package.json
        run: npm run check:links

  build:
    name: Build (${{ matrix.os }})
    needs: links
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-2022
            args: --win
          - os: ubuntu-latest
            args: --linux
    steps:
      - uses: actions/checkout@v4

      # Node 22, matching .nvmrc and package.json `engines`. Node 24 has no
      # better-sqlite3 prebuild and breaks node-pty's winpty gyp build.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # node-gyp (used to rebuild native node-pty) imports distutils, which was
      # removed in Python 3.12. Pin 3.11 and install setuptools so the distutils
      # shim is available across all runners.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Provide distutils for node-gyp
        run: python -m pip install --upgrade setuptools

      # Full install, scripts and all: this is the one place the native rebuild
      # (and tools/patch-node-pty-conpty.cjs) MUST actually succeed.
      - name: Install dependencies
        run: npm ci

      - name: Compile (electron-vite → out/)
        run: npm run build
        env:
          # Anonymous product analytics (TELEMETRY.md). The PostHog project key
          # is public/write-only, but only official release builds inject it —
          # forks without the secret compile with '' and analytics no-ops.
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}

      # Windows code signing (Azure Trusted Signing). electron-builder hard-FAILS
      # the instant `win.azureSignOptions` exists in the config without
      # AZURE_TENANT_ID / AZURE_CLIENT_ID in the environment — app-builder-lib's
      # codeSign/windowsSignAzureManager.js verifies them before it signs
      # anything — so the block cannot live in electron-builder.yml
      # unconditionally: a fork, or a contributor running `npm run dist:win`,
      # would stop being able to build at all. It is layered on from here
      # instead, only on the Windows runner and only when the secrets actually
      # exist. With them unset this resolves to an empty string and Windows ships
      # unsigned exactly as it does today — no behaviour change, just the wire.
      - name: Resolve Windows signing arguments
        id: winsign
        if: runner.os == 'Windows'
        shell: bash
        env:
          # The `secrets` context is not available in a step `if:`, so the
          # presence check has to happen here in the shell.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: |
          if [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_ENDPOINT" ] && [ -n "$AZURE_CODE_SIGNING_ACCOUNT" ] && [ -n "$AZURE_CERT_PROFILE" ]; then
            echo "args=-c.win.azureSignOptions.endpoint=$AZURE_ENDPOINT -c.win.azureSignOptions.codeSigningAccountName=$AZURE_CODE_SIGNING_ACCOUNT -c.win.azureSignOptions.certificateProfileName=$AZURE_CERT_PROFILE" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing Windows artifacts with Azure Trusted Signing."
          else
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "::warning::Azure Trusted Signing is not configured - Windows installers ship UNSIGNED and every user hits SmartScreen on the primary install path. Set AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_ENDPOINT, AZURE_CODE_SIGNING_ACCOUNT and AZURE_CERT_PROFILE to turn signing on."
          fi

      - name: Package installers
        # GH_TOKEN lets electron-builder skip its own publish; we upload via the
        # release step below for full control over the asset set.
        # steps.winsign.outputs.args is empty on macOS/Linux (the step is skipped)
        # and on Windows without the Azure secrets.
        run: npx electron-builder ${{ matrix.args }} ${{ steps.winsign.outputs.args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing + notarization — MUST be macOS-only. CSC_LINK is the
          # Apple Developer ID .p12; if it leaks into the Windows/Linux runners,
          # electron-builder tries to sign those targets with the mac cert and the
          # build hard-fails ("cannot extract publisher name"). So gate on the OS.
          #   APPLE_CERTIFICATE_P12       = base64 of the "Developer ID Application" .p12
          #   APPLE_CERTIFICATE_PASSWORD  = that .p12's export password (REQUIRED if P12 set,
          #                                 else electron-builder imports with an empty
          #                                 password and fails "MAC verification failed")
          # All optional: with the secrets unset every runner builds unsigned and stays green.
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.APPLE_CERTIFICATE_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
          # Azure Trusted Signing credentials — same per-runner discipline as the
          # Apple block above. Inert unless the step above actually turned signing
          # on: electron-builder only reads them when azureSignOptions is present.
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          # Hash EVERYTHING this job uploads, not only the installers. `latest*.yml`
          # is the electron-updater feed: it carries the sha512 the updater validates
          # the downloaded installer against, which makes it the highest-value tamper
          # target on the release page and the one artifact no human ever verifies by
          # hand. The blockmaps drive differential download off that same feed.
          # Anything not named in SHA256SUMS.txt is outside the attestation, and
          # test/ci-config.test.cjs pins this list against the upload list below.
          #
          # The INSTALLERS are checked separately, and their absence FAILS the job.
          # Widening the glob disarms the old "this build produced nothing" tripwire:
          # electron-builder writes latest*.yml on any run that gets this far, so a
          # single non-empty check would pass for a build that produced a feed and no
          # installer at all — and the job would go on to publish an attested update
          # feed with nothing to install, every check green.
          installers=$(ls *.dmg *.zip *.exe *.AppImage 2>/dev/null || true)
          if [ -z "$installers" ]; then
            echo "::error::no installers (*.dmg *.zip *.exe *.AppImage) in dist/ — refusing to publish an attested update feed with nothing to install"
            exit 1
          fi
          files=$(ls *.dmg *.zip *.exe *.AppImage *.blockmap latest*.yml 2>/dev/null || true)
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum $files > "SHA256SUMS-${{ matrix.os }}.txt"
          else
            shasum -a 256 $files > "SHA256SUMS-${{ matrix.os }}.txt"
          fi
          cat "SHA256SUMS-${{ matrix.os }}.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-dist
          # zip + latest*.yml + blockmaps feed electron-updater (auto-update):
          # latest-mac.yml points Squirrel.Mac at the zip; nsis/AppImage use
          # latest.yml/latest-linux.yml + blockmaps for differential download.
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml
            dist/SHA256SUMS-*.txt
          if-no-files-found: warn

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # A job-level permissions block REPLACES the workflow-level one rather than
    # extending it, so `contents: write` has to be restated here — omit it and
    # the release upload below silently loses its token and 403s.
    permissions:
      contents: write # softprops/action-gh-release uploads the assets
      id-token: write # mint the OIDC token Sigstore signs the provenance with
      attestations: write # persist the attestation against this repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten + merge checksums
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.blockmap' -o -name 'latest*.yml' \) -exec cp {} release/ \;
          cat artifacts/*/SHA256SUMS-*.txt > release/SHA256SUMS.txt 2>/dev/null || true
          ls -la release

      # FLOOR-06. Windows and macOS ship UNSIGNED here — every route to code
      # signing is a recurring charge this project does not pay — so Sigstore
      # provenance plus the published checksums are the entire control a user
      # has to tell a real artifact from a tampered one.
      #
      # The subject is the merged checksums file the step above already
      # produces: one call then covers every artifact named in it, across all
      # three platforms, instead of three per-platform globs. And it runs BEFORE
      # the upload, so the digests that get attested are the bytes that ship.
      #
      # Verify a download with:
      #   gh attestation verify <artifact> --repo MARKXAILABS/hello-markx
      #
      # This does NOT suppress SmartScreen or Gatekeeper — only a paid signing
      # certificate does that. README.md, RELEASE.md and SECURITY.md say so.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: release/SHA256SUMS.txt

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # RELEASE.md is the human-facing notes; GitHub shows it as the body.
          body_path: RELEASE.md
          # A tag carrying a pre-release suffix (v0.4.4-rc.1, -beta.2 …) publishes
          # as a PRE-RELEASE. This is load-bearing, not cosmetic: the in-app
          # updater polls /releases/latest, and GitHub excludes pre-releases from
          # that endpoint. So an rc gets a real, public, shareable download page
          # WITHOUT offering itself to every installed copy of the app — which is
          # exactly what you want for a build that needs testing on a platform the
          # authors cannot run. A clean `vX.Y.Z` tag is unaffected and still ships
          # as the latest release to everyone.
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
            release/SHA256SUMS.txt

      # The `links` job above only proved the version strings agree with each
      # other. This HEADs every advertised /releases/latest/download/ URL and
      # requires 200 — the only moment that answer is meaningful, and the check
      # that would have caught the v0.3.4–v0.3.7 download outage on day one.
      # Skipped for pre-release tags: GitHub deliberately excludes pre-releases
      # from /releases/latest, so those URLs still point at the last stable
      # release and --live would be answering the wrong question.
      - name: Verify published downloads resolve
        if: ${{ !contains(github.ref_name, '-') }}
        run: npm run check:links -- --live
