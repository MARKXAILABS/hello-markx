name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Node 22 everywhere. The pin now rests on node-pty's winpty gyp build alone:
# better-sqlite3 13.x is N-API and ships a prebuild for every platform in the
# matrix, so it loads under Node 24 and the `test` jobs must never rebuild it -
# doing so throws the prebuild away and forces a node-gyp compile that only the
# Linux leg has a pinned Python for. package.json `engines` and .nvmrc agree.
env:
  NODE_VERSION: "22"

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # --ignore-scripts skips postinstall's electron-rebuild: tsc needs the
      # .d.ts files, not compiled native bindings.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck (node + web)
        run: npm run typecheck
      # A hard gate, deliberately in THIS job: it already installs with
      # --ignore-scripts and needs no native build, so lint costs nothing extra
      # here. The flag that makes it a gate lives in package.json's `lint`
      # script (`eslint . --max-warnings 0`), not on this line, so the command is
      # byte-identical to the one a contributor runs locally - one gate, one
      # definition. Both react-hooks/exhaustive-deps and unused-directive
      # reporting default to WARNING severity, so without --max-warnings 0 this
      # step would pass while reporting findings.
      #
      # This step must never be softened. The repo carried 13 inert
      # eslint-disable comments for its whole life because nothing read them;
      # a lint step that reports and merges anyway is the same defect wearing a
      # green tick. test/ci-config.test.cjs pins the step, the flag, and the
      # count of failure-swallowing steps in this file.
      - name: Lint (react-hooks, zero warnings)
        run: npm run lint
      - name: npm audit (high and above)
        # Advisory. A fresh advisory in a transitive dep should be visible on the
        # PR, not block an unrelated change; dependabot (.github/dependabot.yml)
        # is what opens the actual bump PR.
        continue-on-error: true
        run: npm audit --audit-level=high

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # All three platforms are hard gates. There is no continue-on-error here, and
    # nothing should re-add one.
    #
    # For a long time 11 tests failed on Windows and were waved through as "POSIX
    # path assumptions in the tests". That description was wrong. On triage, 7 of
    # the 11 were real Windows SOURCE bugs and only 4 were test bugs:
    #   - expandTilde() stamped the process's cwd drive letter onto rooted paths,
    #     and those values are persisted into config          (#58)
    #   - the Codex remote endpoint was built with path.join, so its unix:// URI
    #     came out with backslashes                            (#60)
    #   - the Windows Node installer was a silent no-op, and a checksum mismatch
    #     did NOT abort — msiexec ran on an unverified MSI      (#57)
    # A permanently-yellow job is how all three of those stayed invisible while
    # Windows support shipped as the v0.4.4 headline. Fix the failure; do not
    # exempt the platform.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # --ignore-scripts on purpose, and it must STAY that way: the app's own
      # postinstall runs electron-rebuild, which builds node-pty for the ELECTRON
      # ABI — and `node --test` then cannot load it either.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # ...but two test files DO need node-pty loadable under plain Node:
      # test/win-cmd-shim.test.cjs and test/hive-runtime-path.test.cjs both
      # loadTs('src/main/pty.ts'), whose first line is `import * as pty from
      # 'node-pty'`, and node-pty/lib/index.js loads the native module at MODULE
      # scope on non-win32. node-pty ships prebuilds for darwin-* and win32-* but
      # not linux-*, which is why those two files failed on ubuntu ALONE, and 70
      # tests went silently uncollected there (#53).
      #
      # Cheap and non-flaky everywhere a prebuild exists: node-pty's install
      # script finds it, exits 0, and nothing is compiled. Only Linux runs
      # node-gyp — which shells out to Python, which since 3.12 no longer has
      # distutils, so pin it exactly as the release workflow does.
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: "3.11"
      - name: Provide distutils for node-gyp
        if: runner.os == 'Linux'
        run: python -m pip install --upgrade setuptools
      - name: Build node-pty for the Node ABI
        run: npm rebuild node-pty
      # `test/*.test.cjs` is a glob Node expands itself (so it also works from
      # cmd.exe on Windows, which does not glob). Deliberately NOT a hand-written
      # file list: that is how eight test files went unrun for months (#7).
      - name: Run the test suite
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies (without the native rebuild)
        run: npm ci --ignore-scripts

      - name: Rebuild native modules (node-pty, better-sqlite3)
        # This is the one historically flaky step — node-gyp, winpty, prebuilds.
        # It used to make the WHOLE build job continue-on-error, which meant a
        # real TypeScript/bundler break merged green too (#7). Isolated here so
        # the compile below is a hard gate. The release workflow rebuilds for
        # real on every platform, and there it must pass.
        continue-on-error: true
        run: npx electron-rebuild -f

      # electron-vite build needs the electron package's version, not its
      # binary, so it is a genuine gate even after the step above is skipped.
      #
      # It is ALSO the clean-checkout assertion for #52: nothing in this job
      # generates anything, so an asset that is imported but never committed —
      # as docs/logo.png was, killing the renderer bundle on every fresh clone —
      # fails right here. tools/make-logo.cjs cannot be a build step (its last
      # output goes through macOS-only `iconutil`), so the rasters are committed
      # and `npm run brand` regenerates them. test/build-assets.test.cjs catches
      # the same class in milliseconds, on all three platforms.
      - name: Compile (electron-vite -> out/)
        run: npm run build
